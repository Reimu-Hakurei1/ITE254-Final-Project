<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITE254-Final-Project - Home</title>
    <link rel="icon" type="image/png" href="../image/icon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles-web.css">
    <link rel="stylesheet" href="../css/curtain.css">
    <link rel="stylesheet" href="../css/snow.css">
    <link rel="stylesheet" href="../css/cherry-blossom.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <meta name="theme-color" content="#0a0a0a">
</head>
<body>
    <!-- Curtain script loads first -->
    <script src="../js/curtain.js"></script>

    <!-- Theme switcher button -->
    <div class="theme-switcher">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
            <span class="light-icon">☀️</span>
            <span class="dark-icon">🌙</span>
        </button>
    </div>

    <!-- Hidden iframe (background music) -->
    <iframe src="save game room/index.html" style="display:none;" id="hidden-frame"></iframe>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="../index.html">ITE254-Final-Project</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="levelselector.html">Play Game</a></li>
                    <li class="nav-item"><a class="nav-link" href="characters.html">Characters</a></li>
                    <li class="nav-item"><a class="nav-link" href="music.html">Music</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>

                <!-- Profile circle dropdown -->
                <div class="d-flex align-items-center">
                    <div class="dropdown">
                        <div id="userProfile" class="profile-circle dropdown-toggle d-none" data-bs-toggle="dropdown" aria-expanded="false"></div>
                        <ul class="dropdown-menu dropdown-menu-end" id="profileDropdown">
                            <!-- Dropdown content will be populated by firebase-config.js -->
                        </ul>
                    </div>
                    <!-- Snow toggle button -->
                    <button id="navSnowToggle" class="btn btn-outline-dark btn-sm ms-2" title="Enable snow" style="padding: 0.25rem 0.5rem; width: 40px;">
                        <i class="bi bi-snow"></i>
                    </button>
                    <!-- Cherry blossom toggle button -->
                    <button id="cherryToggle" class="btn btn-outline-dark btn-sm ms-2" title="Cherry Blossom" style="padding: 0.25rem 0.5rem; width: 40px;">
                        🌸
                    </button>
                </div>
            </div>
        </div>
    </nav>

  <main class="container my-4">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white py-3">
            <h4 class="card-title mb-0">
              <i class="fas fa-user-cog me-2"></i>
              <span class="text-white" data-i18n="profile_settings">Profile Settings</span>
            </h4>
          </div>
          <div class="card-body">
            <!-- User Information -->
            <div class="row mb-4">
              <div class="col-12 text-center">
                <div class="mb-3">
                  <div class="avatar-lg">
                    <i class="fas fa-user"></i>
                  </div>
                </div>
                <h4 id="profileUserName" class="mb-1">User</h4>
                <p class="text-muted" id="profileUserEmail">Loading...</p>
              </div>
            </div>

            <form id="profileForm">
              <div class="row g-3">
                <!-- Personal Information -->
                <div class="col-12">
                  <h5 class="text-primary mb-3">
                    <i class="fas fa-id-card me-2"></i>
                    <span data-i18n="personal_info">Personal Information</span>
                  </h5>
                </div>

                <div class="col-md-6">
                  <label for="profileFirstName" class="form-label" data-i18n="first_name">First Name</label>
                  <input type="text" class="form-control" id="profileFirstName" required>
                </div>

                <div class="col-md-6">
                  <label for="profileLastName" class="form-label" data-i18n="last_name">Last Name</label>
                  <input type="text" class="form-control" id="profileLastName" required>
                </div>

                <!-- Contact Information -->
                <div class="col-12 mt-4">
                  <h5 class="text-primary mb-3">
                    <i class="fas fa-address-book me-2"></i>
                    <span data-i18n="contact_info">Contact Information</span>
                  </h5>
                </div>

                <div class="col-12">
                  <label for="profileEmail" class="form-label" data-i18n="email">Email</label>
                  <input type="email" class="form-control" id="profileEmail" required readonly>
                  <div class="form-text" data-i18n="email_readonly">Email cannot be changed</div>
                </div>

                <!-- Save Button -->
                <div class="col-12 mt-4">
                  <button type="submit" class="btn btn-primary btn-lg w-100 py-3" id="saveProfileBtn">
                    <i class="fas fa-save me-2"></i>
                    <span data-i18n="save_profile">Save Changes</span>
                  </button>
                </div>
              </div>
            </form>

            <!-- Success Message -->
            <div id="saveSuccess" class="alert alert-success mt-3" style="display: none;">
              <i class="fas fa-check-circle me-2"></i>
              <span data-i18n="save_success">Profile saved successfully!</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
   <!-- Footer -->
    <footer class="text-center p-4 bg-dark">
        <div class="container">
            <p class="mb-3">© 2025 ITE254 Final Project - Mario Forever Remake</p>
            <div class="social-icons mb-3">
                <a href="https://www.facebook.com/" class="me-2" title="Share on Facebook"><i class="bi bi-facebook"></i></a>
                <a href="https://www.twitter.com/" class="me-2" title="Share on Twitter"><i class="bi bi-twitter"></i></a>
                <a href="https://www.instagram.com/" title="Share on Instagram"><i class="bi bi-instagram"></i></a>
            </div>
            <div>
                <a href="html/contact.html" class="btn btn-outline-dark btn-sm me-2">Contact Us</a>
                <a href="html/about.html" class="btn btn-outline-dark btn-sm">About Project</a>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-auth-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/theme-switcher.js"></script>
    <script src="../js/snow.js"></script>
    <script src="../js/cherry-blossom.js"></script>
	<script src="../js/settings.js"></script>
</body>
</html>
