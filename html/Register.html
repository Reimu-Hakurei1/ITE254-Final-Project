<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - ITE254 Final Project</title>
  <link rel="icon" type="image/png" href="../image/icon.png">
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">

  <!-- Firebase & Register.js -->
  <script type="module" src="../js/Register.js" defer></script>

  <style>
    body {
      background: url("../image/Image.jpg") no-repeat center center fixed;
      background-size: cover;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 1rem;
      backdrop-filter: blur(2px);
    }
    @media (max-width: 576px) {
      .card {
        width: 90% !important;
        margin: 1rem;
      }
    }
  </style>
</head>

<body class="d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow p-4" style="width: 24rem; max-width: 90%;">
    <h2 class="text-center mb-4">Create Account</h2>
    <form id="registerForm">
      <!-- First Name & Last Name row -->
      <div class="row g-2 mb-3">
        <div class="col-md-6">
          <label for="firstName" class="form-label">First Name</label>
          <input type="text" id="firstName" class="form-control" placeholder="First name" required>
        </div>
        <div class="col-md-6">
          <label for="lastName" class="form-label">Last Name</label>
          <input type="text" id="lastName" class="form-control" placeholder="Last name" required>
        </div>
      </div>

      <!-- Email -->
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Create a password" required>

        <!-- Password requirements -->
        <ul id="passwordRequirements" class="list-unstyled mt-2 small">
          <li id="uppercase" class="text-danger">❌ At least one uppercase letter</li>
          <li id="lowercase" class="text-danger">❌ At least one lowercase letter</li>
          <li id="number" class="text-danger">❌ At least one number</li>
          <li id="special" class="text-danger">❌ At least one special character</li>
        </ul>
      </div>
      
      <!-- Confirm Password -->
      <div class="mb-3">
        <label for="confirmPassword" class="form-label">Confirm Password</label>
        <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm your password" required>
      </div>
      
      <!-- Submit Button -->
      <button id="submit" type="submit" class="btn btn-primary w-100">Create Account</button>

      <!-- Google Register (normal style) -->
      <button id="googleRegister" type="button" class="btn btn-info w-100 mt-2">
        Register with Google
      </button>

      <!-- Already have account -->
      <div class="text-center mt-3">
        <p class="mb-0">Already have an account? <a href="./Login.html">Login</a></p>
      </div>
    </form>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Password validation script -->
  <script>
    const passwordInput = document.getElementById("password");

    const requirements = {
      uppercase: /[A-Z]/,
      lowercase: /[a-z]/,
      number: /[0-9]/,
      special: /[^A-Za-z0-9]/
    };

    const updateRequirement = (id, valid, text) => {
      const element = document.getElementById(id);
      if (valid) {
        element.classList.remove("text-danger");
        element.classList.add("text-success");
        element.innerHTML = "✅ " + text;
      } else {
        element.classList.remove("text-success");
        element.classList.add("text-danger");
        element.innerHTML = "❌ " + text;
      }
    };

    passwordInput.addEventListener("input", () => {
      const value = passwordInput.value;
      updateRequirement("uppercase", requirements.uppercase.test(value), "At least one uppercase letter");
      updateRequirement("lowercase", requirements.lowercase.test(value), "At least one lowercase letter");
      updateRequirement("number", requirements.number.test(value), "At least one number");
      updateRequirement("special", requirements.special.test(value), "At least one special character");
    });
  </script>
</body>
</html>
