<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" /> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password</title>
  <link rel="icon" type="image/png" href="../image/icon.png">
  
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/site-refresh.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <!-- Firebase Forgot Password -->
  <script type="module" src="../js/ForgotPassword.js" defer></script>

  <style>
    body {
      background: url("../image/Image.jpg") no-repeat center center fixed;
      background-size: cover;
    }
  </style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
</head>

<body class="auth-page d-flex justify-content-center align-items-center min-vh-100">
  <div class="card shadow p-4" style="width: 22rem;">
    <a class="auth-home" href="../index.html"><i class="bi bi-arrow-left"></i> Mario Forever</a>
    <h2 class="text-center mb-4">Forgot Password</h2>
    <form id="resetForm">
      <!-- Email -->
      <div class="mb-3">
        <label for="resetEmail" class="form-label">Enter your email</label>
        <input
          type="email"
          id="resetEmail"
          class="form-control"
          placeholder="Enter Email"
          required
        />
      </div>

      <!-- Reset Button -->
      <button type="submit" class="btn btn-primary w-100">
        Send Reset Link
      </button>

      <!-- Back to Login -->
      <div class="register-link text-center mt-3">
        <p>
          Remembered your password? <a href="./Login.html">Login</a>
        </p>
      </div>
    </form>
  </div>

  <!-- Optional Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
